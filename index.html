function insert(word, meaning, source) {
  const key=clean(word);
  if(!key || !meaning) return;
  const rec={word:String(word).trim(),meaning:String(meaning).trim(),source};
  const old=records.get(key);
  if(!old || (['basic','editorial'].includes(old.source) && source==='ejdict')) records.set(key,rec);
  else if(source==='ejdict' && old.source==='ejdict' && old.meaning!==rec.meaning){
    // Idempotent re-import: the same source line must not appear twice after refresh.
    const parts=old.meaning.split(' / ');
    if(!parts.includes(rec.meaning)) records.set(key,{...old,meaning:old.meaning+' / '+rec.meaning});
  }
}
function readText(text, source='ejdict') {
  let count=0;
  const lines=text.split(/\r?\n/);
  for(const line of lines){
    const tab=line.indexOf('\t'); if(tab<1) continue;
    const heads=line.slice(0,tab).trim(); const meaning=line.slice(tab+1).trim();
    if(!meaning)continue;
    // The official data separates spelling variants using a comma.
    for(const head of heads.split(/\s*,\s*/)){
      if(!head)continue;
      insert(head,meaning,source);count++;
    }
  }
  return count;
}
function readJSON(text){
  let words=0; const parsed=JSON.parse(text);
  if(Array.isArray(parsed)){
    for(const e of parsed){
      if(Array.isArray(e)&&e.length>=2){insert(e[0],e[1],'ejdict');words++;}
      else if(typeof e==='object'&&e&&('word' in e||'title' in e)){
        insert(e.word||e.title,e.meaning||e.translation||e.description,'ejdict');words++;
      }
    }
  }else if(parsed&&typeof parsed==='object'){
    for(const [w,m] of Object.entries(parsed))if(typeof m==='string'){insert(w,m,'ejdict');words++;}
  }
  return words;
}

function openDB(){return new Promise(resolve=>{
  if(!window.indexedDB){resolve(null);return;}
  try{const req=indexedDB.open('lexia_dictionary_v1',1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('packs'))req.result.createObjectStore('packs',{keyPath:'letter'});};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null);req.onblocked=()=>resolve(null);
  }catch{resolve(null);}
});}
async function loadStoredPacks(){
  const db=await openDB();state.cacheAvailable=!!db;
  if(!db)return;
  return new Promise(resolve=>{
    try{const req=db.transaction('packs','readonly').objectStore('packs').getAll();
      req.onsuccess=()=>{for(const row of req.result||[]){
        if(typeof row.text!=='string')continue;
        if(LETTERS.includes(row.letter)){
          state.packTexts.set(row.letter,row.text);readText(row.text);state.loaded.add(row.letter);
        }else if(row.letter?.startsWith('import:')){
          try{row.format==='json'?readJSON(row.text):readText(row.text);}catch{/* malformed cached import */}
        }
      }resolve();};req.onerror=()=>resolve();
    }catch{resolve();}
  });
}
async function storePack(letter,text,format='tsv'){
  const db=await openDB();if(!db)return;
  return new Promise(resolve=>{try{const tx=db.transaction('packs','readwrite');tx.objectStore('packs').put({letter,text,format,updated:Date.now()});tx.oncomplete=()=>resolve();tx.onerror=()=>resolve();}catch{resolve();}});
}
async function getLocalManifest(){
  // No bundled packs in the starter ZIP. A genuine offline build creates this manifest.
  try{
    const res=await fetch('./data/ejdict/manifest.json',{cache:'no-cache'});
    if(!res.ok)return null;
    const manifest=await res.json();
    if(manifest?.source!=='kujirahand/EJDict'||!Array.isArray(manifest.letters)||manifest.letters.length!==26)return null;
    if(!manifest.letters.every(l=>LETTERS.includes(l.letter)&&Number.isInteger(l.lines)&&l.lines>0))return null;
    return manifest;
  }catch{return null;}
}
async function fetchLetter(letter){
  let lastError;
  const sources = [...(state.localManifest?[`./data/ejdict/${letter}.txt`]:[]),...EJD_BASES.map(base=>base+letter+'.txt')];
  for(const url of sources){
    try{
      const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),22000);
      let response;
      try{response=await fetch(url,{signal:controller.signal,cache:'default'});}finally{clearTimeout(timeout);}
      if(!response.ok)throw Error(`HTTP ${response.status}`);
      const text=await response.text();
      if(text.length<100||!text.includes('\t'))throw Error('invalid dictionary text');
      const matchCount=(text.match(/\t/g)||[]).length;
      if(matchCount<10)throw Error('dictionary pack too short');
      if(state.localManifest&&url.startsWith('./data/')){
        const info=state.localManifest.letters.find(x=>x.letter===letter);
        if(info&&Math.abs(info.lines-matchCount)>2)throw Error('bundled pack count mismatch');
      }
      return text;
    }catch(error){lastError=error;}
  }
  throw lastError||Error('download failed');
}
async function ensureLetter(letter){
  if(!LETTERS.includes(letter))return false;
  if(state.loaded.has(letter))return true;
  if(pendingLetters.has(letter))return pendingLetters.get(letter);
  const job=(async()=>{
    const text=await fetchLetter(letter);
    // Validate all lines before storing; an HTML error page must never be cached as a dictionary.
    if((text.match(/\t/g)||[]).length<10)throw new Error('Pack is too short');
    state.packTexts.set(letter,text);
    readText(text);state.loaded.add(letter);
    await storePack(letter,text);
    badgeUpdate();
    if(state.view==='search'){renderResults();renderDetail();}
    if(state.view==='data')renderData();
    return true;
  })().finally(()=>pendingLetters.delete(letter));
  pendingLetters.set(letter,job);
  return job;
}
async function syncDictionary(force=false){
  if(state.loading)return;
  const tasks=LETTERS.filter(l=>force||!state.loaded.has(l));
  if(!tasks.length){hideBanner();badgeUpdate();renderDataIfVisible();return;}
  state.loading=true;state.error=false;
  let completed=0,failures=[];const total=tasks.length;
  showBanner(`英和データを取得中（${state.loaded.size}/26文字）`,state.loaded.size/26*100);
  renderDataIfVisible();
  async function worker(){while(tasks.length){
    const letter=tasks.shift();
    try{
      if(force&&state.loaded.has(letter)) { // Refresh only after removing the old marker.
        state.loaded.delete(letter);
      }
      await ensureLetter(letter);
    }catch(e){failures.push(letter);}
    completed++;
    badgeUpdate();
    showBanner(`英和データを取得中（${completed}/${total}処理・保存済${state.loaded.size}/26文字）`,state.loaded.size/26*100);
    if(state.view==='data')renderData();
  }}
  await Promise.all(Array.from({length:Math.min(4,tasks.length)},worker));
  state.loading=false;state.error=failures.length>0;
  if(failures.length){showBanner(`${state.loaded.size}/26文字を取得。失敗：${failures.join(', ')}。通信状態を確認し再試行できます。`,state.loaded.size/26*100,true);}
  else{hideBanner();showToast(`検索可能語数 ${countActual().toLocaleString()} 件`);}
  badgeUpdate();if(state.view==='search'){renderResults();renderDetail();}renderDataIfVisible();
}
function bestCandidates(query, max=40){
  const q=clean(query);if(!q)return [];
  const exact=[],prefix=[],contains=[];
  for(const [key,rec] of records){
    if(key===q){exact.push(rec);continue;}
    if(key.startsWith(q)){prefix.push(rec);continue;}
    if(q.length>=3&&key.includes(q)&&contains.length<80)contains.push(rec);
  }
  prefix.sort((a,b)=>a.word.length-b.word.length||a.word.localeCompare(b.word,'en'));
  contains.sort((a,b)=>a.word.length-b.word.length||a.word.localeCompare(b.word,'en'));
  return [...exact,...prefix,...contains].slice(0,max);
}
function lemmaCandidates(q){
  const list=[];const add=s=>{s=clean(s);if(s&&!list.includes(s))list.push(s);};
  if(q.endsWith('ies'))add(q.slice(0,-3)+'y');
  if(q.endsWith('ing')){const stem=q.slice(0,-3);add(stem);add(stem+'e');if(stem.length>=2&&stem.at(-1)===stem.at(-2))add(stem.slice(0,-1));}
  if(q.endsWith('ied'))add(q.slice(0,-3)+'y');
  if(q.endsWith('ed')){add(q.slice(0,-2));add(q.slice(0,-1));const stem=q.slice(0,-2);if(stem.length>=2&&stem.at(-1)===stem.at(-2))add(stem.slice(0,-1));}
  if(q.endsWith('es')){add(q.slice(0,-2));add(q.slice(0,-1));}
  if(q.endsWith('s'))add(q.slice(0,-1));
  const irregular={went:'go',gone:'go',ran:'run',written:'write',wrote:'write',made:'make',took:'take',taken:'take',gave:'give',given:'give',seen:'see',saw:'see',thought:'think',bought:'buy',children:'child',men:'man',women:'woman',feet:'foot',mice:'mouse',better:'good',best:'good',was:'be',were:'be',is:'be',are:'be'};
  if(irregular[q])add(irregular[q]);return list.filter(s=>records.has(s));
}
function renderResults(){
  const q=clean(el('search-input').value)||clean(state.current);
  if(!q){
    el('results-label').textContent='検索候補';
    el('results-count').textContent='';
    el('results').innerHTML='<div class="empty-results">英単語を入力すると候補が表示されます。</div>';
    return;
  }
  const candidates=bestCandidates(q);
  const fallback=!candidates.length?lemmaCandidates(q):[];
  const out=candidates.length?candidates:fallback.map(k=>records.get(k));
  el('results-label').textContent=candidates.length?'検索候補':fallback.length?'原形の候補':'見出し語';
  el('results-count').textContent=out.length?`${out.length} 件${candidates.length>=40?' +':''}`:'0 件';
  if(!out.length){el('results').innerHTML='<div class="empty-results">一致する見出し語がありません。<p>別のつづりや単語の原形で検索してください。</p></div>';return;}
  el('results').innerHTML=out.map(rec=>`<button class="result-row ${clean(state.current)===clean(rec.word)?'active':''}" data-select="${escapeHTML(clean(rec.word))}" title="${escapeHTML(rec.word)}"><span class="result-word">${escapeHTML(rec.word)}</span><span class="result-meaning">${escapeHTML(rec.meaning)}</span></button>`).join('');
}

function rawFormat(text){

function senseMarkup(s,i){return `<section class="sense"><div class="sense-num">${i+1}</div><div class="sense-content">${s.pos?`<div class="sense-label">${escapeHTML(s.pos)}</div>`:''}<div class="sense-meaning">${escapeHTML(s.jp)}</div>${s.pattern?`<div class="pattern">${escapeHTML(s.pattern)}</div>`:''}${s.en?`<div class="example-card"><div class="en">${escapeHTML(s.en)}</div><div class="ja">${escapeHTML(s.ja||'')}</div></div>`:''}</div></section>`;}
function renderDetail(){

function renderApiContent(api,word){

async function loadApi(key){
  if(state.apiInfo.has(key))return;
  if(!/^[a-z][a-z\s'-]{0,45}$/i.test(key)){state.apiInfo.set(key,null);return;}
  try{
    const response=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(key));
    if(!response.ok)throw new Error('not found');
    const arr=await response.json();const first=Array.isArray(arr)?arr[0]:null;
    if(!first||!Array.isArray(first.meanings))throw new Error('no meanings');
    const ipa=first.phonetic||first.phonetics?.find(p=>p.text)?.text||'';
    const audio=first.phonetics?.find(p=>p.audio)?.audio||'';
    state.apiInfo.set(key,{phonetic:ipa,audio,meanings:first.meanings});
  }catch{state.apiInfo.set(key,null);}
  if(state.view==='search'&&clean(state.current)===key)renderDetail();
}
function setWord(word, options={}){
  const key=clean(word);if(!records.has(key))return;
  state.current=key;
  if(!options.keepInput)el('search-input').value=records.get(key).word;
  if(!options.noHistory){state.history=[key,...state.history.filter(x=>x!==key)].slice(0,80);storageWrite('lexia:history',state.history);}
  switchView('search',false);
  renderResults();renderDetail();loadApi(key);
  if(options.scroll&&window.innerWidth<=600)el('detail').scrollIntoView({behavior:'smooth',block:'start'});
}
async function submitSearch(){
  const q=clean(el('search-input').value);
  if(!q){renderEmpty();return;}
  // Serve an exact match immediately even if the other 25 letter packs are still loading.
  if(records.has(q)){setWord(q,{scroll:true});return;}
  let choices=bestCandidates(q,1);if(choices.length){setWord(choices[0].word,{scroll:true});return;}
  let forms=lemmaCandidates(q);if(forms.length){setWord(forms[0],{scroll:true});showToast('原形の見出し語を表示しました');return;}
  // A first-time search must not falsely return "not found" before the matching letter has downloaded.
  const letter=q[0];
  if(LETTERS.includes(letter)&&!state.loaded.has(letter)){
    const panel=el('detail');
    panel.innerHTML=`<div class="empty-detail"><div class="empty-icon">↻</div><h2>「${escapeHTML(q)}」の辞書を取得しています</h2><p>初回だけ通信が必要です。文字別辞書を先に取得して検索します。</p></div>`;
    try{await ensureLetter(letter);}catch{
      showToast('辞書の取得に失敗しました。オンライン接続を確認してください');
      panel.innerHTML=`<div class="empty-detail"><div class="empty-icon">!</div><h2>辞書データを取得できませんでした</h2><p>「${escapeHTML(q)}」が存在しないとは限りません。接続を確認し、辞書データ画面から再取得してください。</p></div>`;
      return;
    }
    if(clean(el('search-input').value)!==q)return;
    if(records.has(q)){setWord(q,{scroll:true});return;}
    choices=bestCandidates(q,1);if(choices.length){setWord(choices[0].word,{scroll:true});return;}
    forms=lemmaCandidates(q);if(forms.length){setWord(forms[0],{scroll:true});showToast('原形の見出し語を表示しました');return;}
  }
  state.current='';renderResults();el('detail').innerHTML=`<div class="empty-detail"><div class="empty-icon">?</div><h2>「${escapeHTML(q)}」は見つかりませんでした</h2><p>スペル・原形を確認してください。検索は端末に取り込まれた辞書データが対象です。</p></div>`;
}
function saveFavorite(){const k=clean(state.current);if(!records.has(k))return;
  if(state.favorites.includes(k)){state.favorites=state.favorites.filter(x=>x!==k);showToast('お気に入りから削除しました');}

function speak(uk=false){
  const word=records.get(clean(state.current))?.word||state.current;
  if(!word)return;
  const api=state.apiInfo.get(clean(word));
  if(!uk&&api?.audio){try{const url=new URL(api.audio,'https://api.dictionaryapi.dev');if(url.protocol==='https:'){
    if(activeAudio)activeAudio.pause();activeAudio=new Audio(url.href);activeAudio.play().catch(()=>speech(word,uk));return;
  }}catch{/* fallback below */}}

function speech(word,uk){

  try{speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(word);utterance.lang=uk?'en-GB':'en-US';utterance.rate=.85;
    const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang.toLowerCase()===utterance.lang.toLowerCase());if(v)utterance.voice=v;

function renderAbout(){
  el('alt-view').innerHTML=`<div class="alt-panel"><h2>Lexia について</h2><p class="subcaption">English–Japanese Dictionary · Version ${APP_VERSION}</p>

function removeItem(raw){const split=raw.indexOf(':');if(split<0)return;const kind=raw.slice(0,split),key=raw.slice(split+1);

 const packs=LETTERS.map(l=>state.packTexts.get(l));
 if(packs.some(x=>!x)){showToast('全26ファイルを取得してからバックアップできます');return;}

 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='lexia-ejdict-hand-backup.tsv';a.click();

async function importData(event){
  const files=Array.from(event.target.files||[]);if(!files.length)return;
  let words=0;
  try{for(const f of files){
    const text=await f.text();
    const isJson=f.name.toLowerCase().endsWith('.json');
    words+=isJson?readJSON(text):readText(text);

  }
    badgeUpdate();showToast(`${words.toLocaleString()} 件を読み込みました`);renderDataIfVisible();
  }catch{showToast('ファイル形式を確認してください');}

function bindEvents(){

      renderResults();

      // for all 26 background packs to finish. Jobs are deduplicated in ensureLetter.

  });

  el('clear-search').addEventListener('click',()=>{el('search-input').value='';state.current='';el('clear-search').classList.remove('visible');renderResults();renderDetail();el('search-input').focus();});

  el('mobile-data-button').addEventListener('click',()=>switchView('data'));

  });
}
async function init(){

 if(ev.target.id==='lex-pattern-select'){precisionState.pattern=ev.target.value;precisionState.expandAll=false;renderDetail();}
});
document.addEventListener('input',ev=>{
 if(ev.target.id==='lex-source-search'){
  precisionState.rawFilter=ev.target.value;
  const root=ev.target.closest('.lex-raw, .raw-meaning');
  const list=root?.querySelector('#lex-source-list');
  const rec=records.get(clean(state.current));
  if(list&&rec){const fresh=document.createElement('div');fresh.innerHTML=sourceSenseList(rec.meaning,precisionState.rawFilter);list.innerHTML=fresh.querySelector('#lex-source-list')?.innerHTML||'';}
 }
 if(ev.target.id==='lex-filter'){
  precisionState.filter=ev.target.value;
  const root=document.getElementById('lex-list');if(root)root.innerHTML=precisionUsageList((Object.hasOwn(CURATED,clean(state.current))?CURATED[clean(state.current)]:null));
 }
});

// Copy and export the edited, short Japanese meanings when available.
copyCurrent = async function(){
  const key=clean(state.current),rec=records.get(key),e=(Object.hasOwn(CURATED,key)?CURATED[key]:null);if(!rec)return;
  const text=e?[e.word, ...e.groups.flatMap(g=>g.senses.map((s,i)=>`${g.pos} ${i+1}. ${s.jp} — ${s.pattern}`))].join('\n'):`${rec.word}\n${rec.meaning}`;
  try{await navigator.clipboard.writeText(text);showToast('日本語訳と用法をコピーしました');}catch{showToast('コピーできませんでした');}
};
exportFavorites = function(){
 const words=state.favorites.map(key=>{const e=(Object.hasOwn(CURATED,key)?CURATED[key]:null),rec=records.get(key);return e?{word:key,type:'edited',parts:e.groups.map(g=>({pos:g.pos,senses:g.senses.map(s=>({jp:s.jp,pattern:s.pattern}))}))}:{word:key,type:'basic',meaning:rec?.meaning||''};});
 const data={app:'Lexia',version:'2.4',exportedAt:new Date().toISOString(),words};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='lexia-favorites.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
};

// Import a structured editorial JSON file. This is not automatic AI translation.
document.addEventListener('click',ev=>{
 if(ev.target.closest('[data-lex-import]'))document.getElementById('precision-import-file')?.click();
});
document.addEventListener('change',async ev=>{
 if(ev.target.id!=='precision-import-file')return;
 const f=ev.target.files?.[0];if(!f)return;
 if(f.size>1500000){showToast('一度に追加できるJSONは1.5MBまでです');return;}
 try{
  const json=JSON.parse(await f.text());
  if(!json||Array.isArray(json)||typeof json!=='object')throw new Error('format');
  const passed={};for(const [word,e] of Object.entries(json)){if(precisionValidate(word,e))passed[word]=e;}
  if(!Object.keys(passed).length)throw new Error('no valid entries');
  let old={};try{old=JSON.parse(localStorage.getItem('lexia:precision-extra')||'{}');}catch{}
  const all={...old,...passed};
  const n=precisionApplyImport(passed);
  try{localStorage.setItem('lexia:precision-extra',JSON.stringify(all));showToast(`${n}語の用法別データを追加しました`);}catch{showToast(`${n}語を追加（保存容量に注意）`);}
  badgeUpdate();renderData();
 }catch{showToast('用法別JSONの形式が正しくありません');}
 ev.target.value='';
});

<script>
// Selected-sense primary drafts remain separate from the precision collection.
const PRIMARY = Object.freeze(Object.fromEntries(JSON.parse(document.getElementById('lexia-primary-data').textContent).map(e=>[e.word,Object.freeze(e)])));
for(const e of Object.values(PRIMARY))if(!records.has(e.word))insert(e.word,e.primary_jp,'basic');
const primaryPreviousDetail=renderDetail;
renderDetail=function(){
 primaryPreviousDetail();
 const key=clean(state.current),e=(Object.hasOwn(PRIMARY,key)?PRIMARY[key]:null);
 if(!e||(Object.hasOwn(CURATED,key)?CURATED[key]:null))return;
 const body=el('detail')?.querySelector('.detail-body');if(!body)return;
 body.querySelector('.lex-brief-warning')?.remove();
 body.querySelector('.lex-quick')?.remove();
 const rec=records.get(key);
 const chip=el('detail').querySelector('.source-chip');
 if(chip&&rec?.source!=='ejdict')chip.textContent='Lexia 基本語義';
 body.insertAdjacentHTML('afterbegin',`<section class="lex-primary" aria-label="基本語義と用法">
 <div class="lex-primary-heading"><strong>基本語義と用法</strong><span class="lex-primary-status">一次原稿・未校閲</span></div>
 <div class="lex-primary-pos">${escapeHTML(e.pos)}</div>
 <div class="lex-primary-gloss">${escapeHTML(e.primary_jp)}</div>
 <div class="section-overline">用法・語の組み合わせ</div><div class="lex-primary-pattern" lang="en">${escapeHTML(e.primary_pattern)}</div>
 ${e.usage_note?`<div class="lex-primary-note"><strong>使い分け</strong><br>${escapeHTML(e.usage_note)}</div>`:''}
 <p class="lex-primary-limit">代表的な1語義を収録しています。他の品詞・語義と和訳付き例文は整備中です。</p></section>`);
 if(rec?.source!=='ejdict'&&!(Object.hasOwn(EDITORIAL,key)?EDITORIAL[key]:null)){
   const raw=body.querySelector('.raw-meaning');
   if(raw?.previousElementSibling?.classList.contains('section-overline'))raw.previousElementSibling.remove();
   raw?.remove();
 }
};
const primaryPreviousResults=renderResults;
renderResults=function(){
 primaryPreviousResults();
 for(const row of el('results').querySelectorAll('[data-select]')){
  const key=clean(row.dataset.select),e=(Object.hasOwn(PRIMARY,key)?PRIMARY[key]:null);if(!e||(Object.hasOwn(CURATED,key)?CURATED[key]:null))continue;
  const label=row.querySelector('.result-meaning');if(label)label.textContent=`${e.pos} · ${e.primary_jp}`;
 }
};
const primaryPreviousData=renderData;
renderData=function(){
 primaryPreviousData();
 const panel=el('alt-view')?.querySelector('.alt-panel');if(!panel)return;
 panel.insertAdjacentHTML('afterbegin',`<div class="lex-primary-stats" id="lex-primary-stats"><strong>基本語義・用法：${Object.keys(PRIMARY).length.toLocaleString('ja-JP')}語</strong><br>各語の品詞・短い訳・語の組み合わせを収録。一次原稿であり、用法別の対訳例文付きデータとは別集計です。</div>`);
};
const primaryPreviousCopy=copyCurrent;
copyCurrent=async function(){
 const key=clean(state.current),e=(Object.hasOwn(PRIMARY,key)?PRIMARY[key]:null);if(!e||(Object.hasOwn(CURATED,key)?CURATED[key]:null))return primaryPreviousCopy();
 const text=[key,e.pos+' '+e.primary_jp,e.primary_pattern,e.usage_note||'','一次原稿・未校閲（代表1語義、対訳例文は整備中）'].filter(Boolean).join('\n');
 try{await navigator.clipboard.writeText(text);showToast('基本語義と用法をコピーしました');}catch{showToast('コピーできませんでした');}
};
</script>
